[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labelcheck-backend"
version = "0.1.0"
description = "LabelCheck — AI-assisted TTB alcohol-label verification (backend)"
requires-python = ">=3.12"

# Runtime dependencies.
#
# Everything here runs fully offline. No dependency downloads a model or calls an
# external service at runtime:
#   - rapidocr-onnxruntime ships the PaddleOCR ONNX models *inside the wheel*,
#     so OCR works with zero network access once installed.
#   - opencv-python-headless / numpy / rapidfuzz are pure local compute.
# This is what satisfies the "no outbound network calls at runtime" non-negotiable.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",   # multipart/form-data (file uploads)
    # Local OCR, models bundled in the wheel. Kept at >=1.2 for broad Python support:
    # 1.4.x covers Python 3.12 (the target), while 1.2.x covers newer interpreters where
    # the 1.3/1.4 wheels aren't published yet.
    "rapidocr-onnxruntime>=1.2",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "rapidfuzz>=3.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",   # FastAPI TestClient
    "ruff>=0.5",
    "pillow>=10.3",  # used only by the sample-image generator script
    "markdown>=3.6",  # used only by scripts/build_docs_html.py
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# A pragmatic, prototype-appropriate rule set: pyflakes, pycodestyle, isort,
# bugbear, comprehensions, pyupgrade.
select = ["E", "F", "I", "B", "C4", "UP"]
# UP042: we intentionally use `class X(str, Enum)` (not StrEnum) so the JSON schema and
# the frontend-generated types stay simple and explicit, as written in the backend skill.
ignore = ["UP042"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are meant to be called in argument defaults.
extend-immutable-calls = [
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Depends",
    "fastapi.Query",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
